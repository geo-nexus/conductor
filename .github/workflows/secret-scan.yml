name: Secret scan

on:
  pull_request:

# Everything else - the fetch-depth: 0 checkout, runs-on, permissions, the
# timeout and the failure policy - lives in the shared workflow, so every
# repository adopting the gate gets the same "Secret Scan" check to require in
# branch protection.
jobs:
  secrets:
    # Forks cannot reach a reusable workflow in the geo-nexus org, so the call
    # would fail there rather than scan anything.
    if: github.repository == 'geo-nexus/conductor'
    uses: geo-nexus/gic-github-resources/.github/workflows/security-secret-scan.yml@main
