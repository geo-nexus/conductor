# Minimal Conductor Configuration
# PostgreSQL + Kafka + No Elasticsearch
# Designed for minimal Docker image with only essential components

# Database persistence type - PostgreSQL only
conductor.db.type=postgres
conductor.queue.type=postgres

# Database connectivity
spring.datasource.url=jdbc:postgresql://postgresdb:5432/conductor
spring.datasource.username=conductor
spring.datasource.password=conductor

# Distributed Locking - Using PostgreSQL (no Redis needed)
conductor.workflow-execution-lock.type=postgres
conductor.app.workflowExecutionLockEnabled=true
conductor.app.lockTimeToTry=500

# Indexing - PostgreSQL only (NO Elasticsearch/OpenSearch)
conductor.indexing.enabled=true
conductor.indexing.type=postgres
# Required to disable connecting to elasticsearch
conductor.elasticsearch.version=0

# External Payload Storage - DISABLED (using database storage only)
# All payloads will be stored directly in PostgreSQL
# conductor.external-payload-storage.type is not set

# Kafka Event Queue Configuration
conductor.event-queues.kafka.enabled=true
conductor.default-event-queue.type=kafka

# Kafka connection settings
conductor.event-queues.kafka.bootstrapServers=redpanda-0:9092
conductor.event-queues.kafka.bootstrap-servers=redpanda-0:9092

# Kafka DLQ and topic configuration
conductor.event-queues.kafka.dlq-topic=conductor-dlq
conductor.event-queues.kafka.listener-queue-prefix=conductor_

# Kafka polling duration (adjust based on environment)
conductor.event-queues.kafka.poll-time-duration=500ms

# Workflow Status Listener - Archive mode
conductor.workflow-status-listener.type=archive

# Metrics - Prometheus enabled for observability
conductor.metrics-prometheus.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus

# System Configuration
conductor.app.systemTaskWorkerThreadCount=20
conductor.app.systemTaskMaxPollCount=20

# Load sample workflows
loadSample=false

# Server Configuration
server.port=8080

# Logging
logging.level.com.netflix.conductor=INFO
logging.level.org.springframework=WARN
